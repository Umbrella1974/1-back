session:
  session_id_prefix: visual_hand_action_test
  output_root: outputs
  participant_id: ""
  condition_id: visual_action
  run_seed: 12345

manus:
  tcp_host: 127.0.0.1
  tcp_port: 8888
  require_tracker: false
  save_raw_frames: true

pinch:
  thumb_node_id: 4
  target_finger_node_id: 14

wrist_rotation:
  enabled: true
  node_id: 0
  quaternion_order: wxyz
  calibration_duration_s: 3.0
  min_valid_frames: 30
  feature_method: calibrated_axis_projection
  enable_up_down: true
  classification_margin: 0.15
  neutral_stability_angle_max_deg: 8.0
  save_timeseries: true
  required: false

calibration:
  open_hand_duration_s: 3.0
  contact_hand_duration_s: 3.0
  pinch_hand_duration_s: 3.0
  threshold_ratio: 0.65
  min_valid_frames: 30
  min_distance_range: 0.02
  min_distance_range_ratio: 0.15
  repetition_count: 3
  stability_window_s: 0.5
  stability_dwell_s: 0.4
  stable_recording_duration_s: 1.5
  quick_check_recording_duration_s: 0.75
  stability_valid_ratio_min: 0.8
  stability_mad_max: 0.004
  stability_range_max: 0.015
  stability_timeout_s: 8.0
  max_acquisition_attempts: 3
  min_state_gap_ratio: 0.10
  max_contact_rep_position_range: 0.25
  max_state_rep_median_range_ratio: 0.20

calibration_reuse:
  enabled: false
  calibration_in: ""
  calibration_out: calibrations/visual_action_cal_v01.json
  quick_check_enabled: true

visual_action_test:
  cue_plan_id: visual-action-1
  episode_count: 3
  middle_events: [slip, up, right, left, down]
  middle_events_per_episode: [3, 6]
  cue_duration_ms: 1000
  fixation_ms: 500
  inter_cue_interval_ms: [3000, 5000]
  random_seed: 12345
  run_analysis: true
  analysis_output_root: analysis_outputs
