plan_id: double-matrix-nozone-1
description: Contact first, then slip-left-right, release last.
random_seed: 123

timing:
  contact_onset_delay_ms: [1000, 2000]
  inter_event_gap_ms: [2000,3000]
  refractory_ms: 3000

events: 

  - name: contact
    modality: matrix
    matrix_sequence:
    - offset_ms: 0
      channel_list: [119,117,114,116,112,115,118,120,82,84,87]
      step_label: contact,up
      output: {mode: hold}
    - offset_ms: 650
      channel_list: [82,84,87]
      step_label: up
      output: {mode: hold}
    duration_ms: 1000
    onset_delay_ms: [1000, 2000]
    trigger_zone: open_zone

  - name: right-slip
    modality: matrix
    matrix_sequence:
    - offset_ms: 0
      channel_list: [87, 88, 89, 119, 117, 114]
      step_label: right
      output: {mode: alternate, step_ms: 100}
    - channel_list: [87, 88, 89, 118, 115, 112]
      step_label: slip
    duration_ms: 3000
    trigger_zone: closed_zone
    simultaneous_group: g2

  - name: release
    modality: matrix
    channel_list: [116]
    output: {mode: auto_off, duration_ms: 650}
    trigger_zone: closed_zone
    duration_ms: 1000

zones:
  open_zone:
    lower: auto_a
    upper: auto_max
  closed_zone:
    lower: auto_min
    upper: auto_a
