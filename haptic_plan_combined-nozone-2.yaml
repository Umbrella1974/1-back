plan_id: double-matrix-nozone-1
description: Contact first, then slip-left-right, release last.
random_seed: 123

timing:
  contact_onset_delay_ms: [1000, 2000]
  inter_event_gap_ms: [2000,3000]
  refractory_ms: 3000

events: 

  - name: contact
    modality: matrix
    channel_list: [119,117,114,116,112,115,118,120]
    duration_ms: 1500
    onset_delay_ms: [1000, 2000]
    trigger_zone: open_zone
    simultaneous_group: g1

  - name: up
    modality: matrix
    channel_list: [82, 84, 87]
    duration_ms: 1000
    trigger_zone: closed_zone
    simultaneous_group: g1

  - name: right
    modality: matrix
    channel_list: [87, 88, 89]
    duration_ms: 1000
    trigger_zone: closed_zone
    simultaneous_group: g2

  - name: slip
    modality: matrix
    matrix_sequence:
    - offset_ms: 0
      channel_list: [119, 117, 114]
    - offset_ms: 100
      channel_list: [118, 115, 112]
    duration_ms: 3000
    trigger_zone: closed_zone
    simultaneous_group: g2 

  - name: release
    modality: matrix
    channel_list: [116]
    trigger_zone: closed_zone
    duration_ms: 1000

zones:
  open_zone:
    lower: auto_a
    upper: auto_max
  closed_zone:
    lower: auto_min
    upper: auto_a
