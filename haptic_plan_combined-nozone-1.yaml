plan_id: combined-nozone-1
description: Contact first, then slip-left-right, release last.
random_seed: 123

timing:
  contact_onset_delay_ms: [1000, 2000]
  inter_event_gap_ms: [2000,3000]
  refractory_ms: 3000

events: 

  - name: contact
    modality: vibration
    command_id: 1
    duration_ms: 1500
    onset_delay_ms: [1000, 2000]
    trigger_zone: open_zone
    simultaneous_group: g1

  - name: up
    modality: matrix
    channel_list: [82, 84, 87]
    duration_ms: 1000
    trigger_zone: closed_zone
    simultaneous_group: g1

  - name: right
    modality: matrix
    channel_list: [87, 88, 89]
    duration_ms: 1000
    trigger_zone: closed_zone
    simultaneous_group: g2

  - name: slip
    modality: vibration
    command_label: slip
    command_id: 11
    duration_ms: 2000
    trigger_zone: closed_zone
    simultaneous_group: g2 

  - name: release
    modality: vibration
    command_label: contact_exit
    command_id: 4
    trigger_zone: closed_zone
    duration_ms: 1500

zones:
  open_zone:
    lower: auto_a
    upper: auto_max
  closed_zone:
    lower: auto_min
    upper: auto_a
